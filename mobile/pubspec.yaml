name: saxony_smart_campus
description: Saxony Egypt University — Smart Campus mobile app (students + doctors).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  socket_io_client: ^2.0.3+1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  connectivity_plus: ^6.0.5
  # Used to read the currently associated Wi-Fi BSSID as a location-proof
  # fallback for QR scans when GPS is unavailable (e.g. basement halls).
  network_info_plus: ^6.1.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/
