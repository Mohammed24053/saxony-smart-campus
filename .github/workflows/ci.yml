name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    # Spin up Postgres + Redis so we can validate the prisma migrations
    # AND run any future integration tests against a real DB.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_campus
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d smart_campus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://campus:campus@localhost:5432/smart_campus?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend prisma:generate
      # Apply all migrations against the ephemeral Postgres service. Any
      # broken SQL in a new migration fails the build here, not in prod.
      - run: pnpm --filter backend prisma:deploy
      - run: pnpm --filter backend exec tsc --noEmit
      - run: pnpm --filter backend lint
      - run: pnpm --filter backend test

  admin:
    name: Admin (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend prisma:generate
      - run: pnpm --filter admin lint
      - run: pnpm --filter admin exec tsc --noEmit
      - run: pnpm --filter admin build

  admin-smoke:
    name: Admin Playwright smoke
    runs-on: ubuntu-latest
    needs: [backend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_campus
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus -d smart_campus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://campus:campus@localhost:5432/smart_campus?schema=public
      REDIS_URL: redis://localhost:6379
      INITIAL_ADMIN_EMAIL: admin@saxony-egypt.edu
      INITIAL_ADMIN_PASSWORD: ChangeMe!2025
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production-use-padding-padding
      QR_HMAC_SECRET: ci-only-qr-hmac-secret-not-for-production-use-padding-padding
      ADMIN_WEB_ORIGIN: http://localhost:3001
      NODE_ENV: test
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      E2E_ADMIN_URL: http://localhost:3001
      E2E_API_URL: http://localhost:3000/api/v1
      E2E_SKIP_WEB_SERVER: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Generate an RS256 keypair on-the-fly. We can't ship a real
      # keypair in the repo, so derive one per-run and export it. The
      # env var names must match `backend/src/config/jwt.config.ts`:
      # JWT_ACCESS_PRIVATE_KEY / JWT_ACCESS_PUBLIC_KEY (not JWT_*_KEY).
      - name: Generate JWT keypair
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/jwt.key 2>/dev/null
          openssl rsa -pubout -in /tmp/jwt.key -out /tmp/jwt.pub 2>/dev/null
          {
            echo "JWT_ACCESS_PRIVATE_KEY<<EOF"
            cat /tmp/jwt.key
            echo "EOF"
            echo "JWT_ACCESS_PUBLIC_KEY<<EOF"
            cat /tmp/jwt.pub
            echo "EOF"
          } >> "$GITHUB_ENV"

      - run: pnpm --filter backend prisma:generate
      - run: pnpm --filter backend prisma:deploy
      - run: pnpm --filter backend run seed

      - name: Start backend
        run: |
          # `nest start` runs in the foreground; spawn it via nohup so the
          # action step doesn't hang waiting for the long-lived process.
          nohup pnpm --filter backend run start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          # Wait for /api/v1/health to respond (apiPrefix is `api/v1`).
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null; then
              echo "backend up after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"
          echo "---- backend log ----"
          tail -200 /tmp/backend.log || true
          exit 1

      - name: Start admin (next dev)
        run: |
          nohup pnpm --filter admin run dev > /tmp/admin.log 2>&1 &
          echo $! > /tmp/admin.pid
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3001/login > /dev/null; then
              echo "admin up after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "admin never became healthy"
          echo "---- admin log ----"
          tail -200 /tmp/admin.log || true
          exit 1

      - name: Run backend pilot smoke (login + doctor schedule + session start/qr/end)
        run: pnpm --filter backend exec ts-node scripts/pilot-smoke.ts
        env:
          API_URL: http://localhost:3000/api/v1

      - name: Install Playwright browsers
        run: pnpm --filter admin exec playwright install --with-deps chromium

      - name: Run smoke pack
        run: pnpm --filter admin smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/playwright-report/
          retention-days: 7

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 3.24.x ships Dart 3.5+, required by build_runner ≥2.4.12.
          flutter-version: '3.24.5'
          channel: stable
      - run: flutter pub get
        working-directory: mobile
      # Pre-existing info/warning lints in the codebase are not blockers
      # for this PR. We surface real errors only; tightening lints is a
      # separate cleanup pass.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: mobile
      # Tests are gated behind a glob check so the job stays green until
      # the test suite lands. Once `mobile/test/` is non-empty, the
      # conditional block runs `flutter test`.
      - name: Run tests if any exist
        working-directory: mobile
        run: |
          if compgen -G "test/**/*_test.dart" > /dev/null; then
            flutter test --coverage
          else
            echo "No widget tests yet — skipping flutter test."
          fi
